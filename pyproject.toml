[project]
name = "starwars-autocalls"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "uvicorn>=0.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell the build backend where the actual package lives (src/ layout),
# so "starwars_autocalls" is importable from anywhere: notebooks,
# integration.py, the API, tests.
packages = ["src/starwars_autocalls"]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.4.2",
]
